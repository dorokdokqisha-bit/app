<style>
/* Layout: maroon masthead + sticky tab rail; ledger-style panels on a warm stone ground. */
:root{
  --bg:#F3F0EE; --surface:#FFFFFF; --sunk:#F8F6F5; --ink:#231719; --muted:#6F6365; --line:#E2DBD9;
  --brand:#6A1B1F; --brand-2:#4E1215; --on-brand:#FBF3E6; --gold:#B5842A; --gold-soft:#F4E7CC;
  --ok:#2E7A4E; --ok-soft:#E3F1E8; --run:#D49A12; --run-soft:#FBF0D3; --bad:#B0281F; --bad-soft:#F8E1DE; --idle:#B9AFAE;
  --f-display:"Brygada 1918", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151011; --surface:#1F1819; --sunk:#191314; --ink:#F0E8E6; --muted:#A99D9E; --line:#382D2E;
  --brand:#4A1316; --brand-2:#360D10; --on-brand:#F6EBD8; --gold:#D8AC55; --gold-soft:#3A2E17;
  --ok:#5DBB86; --ok-soft:#173326; --run:#F0BB3C; --run-soft:#3A2E10; --bad:#F07A6E; --bad-soft:#3D1A17; --idle:#5E5354; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151011; --surface:#1F1819; --sunk:#191314; --ink:#F0E8E6; --muted:#A99D9E; --line:#382D2E;
  --brand:#4A1316; --brand-2:#360D10; --on-brand:#F6EBD8; --gold:#D8AC55; --gold-soft:#3A2E17;
  --ok:#5DBB86; --ok-soft:#173326; --run:#F0BB3C; --run-soft:#3A2E10; --bad:#F07A6E; --bad-soft:#3D1A17; --idle:#5E5354; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand-2)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,td.n,.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.005em}
h2{font-size:22px} h3{font-size:17px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* masthead */
.mast{background:var(--brand);color:var(--on-brand)}
.mast .wrap{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.plate{background:#FFFDF9;border-radius:10px;padding:4px 8px;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.plate img{height:40px;width:auto;display:block}
.mast h1{font-size:20px;color:var(--on-brand)}
.mast .sub{font-size:12px;opacity:.78}
.mast .grow{flex:1;min-width:150px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.dot.ok{background:#62C98F}.dot.wait{background:#F0BB3C}.dot.err{background:#FF8A7E}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--brand-2);border-bottom:1px solid rgba(0,0,0,.2)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs a{color:var(--on-brand);opacity:.72;text-decoration:none;padding:11px 12px;font-size:13px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
.tabs a[aria-current="page"]{opacity:1;border-bottom-color:var(--gold)}

main.wrap{padding-block:22px 64px;display:grid;gap:18px}
.banner{border:1px solid var(--line);background:var(--surface);border-left:3px solid var(--gold);padding:10px 14px;border-radius:8px;font-size:13px}
.banner.bad{border-left-color:var(--bad)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel>h3{margin-bottom:12px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-num);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mut{color:var(--muted)}

/* buttons & forms */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-2)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.dng{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.f input,.f select,.f textarea,input.cell,select.cell{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:14px;width:100%;min-width:0}
input.cell,select.cell{padding:6px 8px;font-size:13px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}

/* tables */
.tw{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:600;border-top:1.5px solid var(--ink);border-bottom:3px double var(--ink)}
tr.sub td{font-weight:600;background:var(--sunk)}
tr.sec td{font-family:var(--f-display);font-weight:600;font-size:14px;padding-top:16px;border-bottom-color:var(--ink)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
.ind td:first-child{padding-left:24px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.run{background:var(--run-soft);color:var(--run);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-size:13px}

/* process lamps */
.lamps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:relative;margin:8px 0 4px}
.lamps::before{content:"";position:absolute;left:7%;right:7%;top:17px;height:2px;background:var(--line)}
.lamps .fill{position:absolute;left:7%;top:17px;height:2px;background:var(--ok);transition:width .4s}
.lamp{display:grid;justify-items:center;gap:6px;text-align:center;background:none;border:0;padding:0 2px;cursor:pointer;position:relative;z-index:1;min-width:0}
.lamp[disabled]{cursor:default}
.bulb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--idle);background:var(--surface);font:600 12px var(--f-num);color:var(--muted)}
.lamp.done .bulb{background:var(--ok);border-color:var(--ok);color:#fff}
.lamp.run .bulb{background:var(--run);border-color:var(--run);color:#2a1d00;box-shadow:0 0 0 0 var(--run);animation:glow 1.8s infinite}
.lamp.late .bulb{background:var(--bad);border-color:var(--bad);color:#fff;animation:glow-bad 1.4s infinite}
.lamp.skip .bulb{border-style:dashed;background:var(--sunk);color:var(--idle)}
.lamp .nm{font-size:12px;font-weight:600;line-height:1.2}
.lamp .st{font-size:11px;color:var(--muted);line-height:1.2}
.lamp .kg,.lamp .in{font-size:10px;line-height:1.2;min-height:1.2em;white-space:nowrap}.lamp .kg{color:var(--muted)}.lamp .in{font-weight:700;color:var(--gold)}
.lamp .nm .sn{display:none}.lamp .nm{max-width:100%;overflow:hidden;text-overflow:clip}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--run) 60%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes glow-bad{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.lamp .bulb{animation:none!important}}
@media (max-width:560px){.lamp{padding:0}.lamp .nm{font-size:9.5px;letter-spacing:-.2px;width:100%}.lamp .nm .fn{display:none}.lamp .nm .sn{display:block}.bulb{width:30px;height:30px}.lamps::before,.lamps .fill{top:14px}.lamp .st{display:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid var(--idle)}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--gold)}
.list{display:grid}
.li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .t{min-width:0}.li .t div:first-child{font-weight:500;overflow-wrap:anywhere}
.li .t div+div{font-size:12px;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,11,.48);z-index:30;display:grid;align-items:end;justify-items:center}
.sheet{background:var(--surface);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:14px}}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
.ro .w{display:none!important}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .lbl{fill:var(--ink);font:500 11px var(--f-num)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:10px;padding:8px 12px;border-radius:8px}
.tree{overflow-x:auto;padding:6px 0 10px}
.tree ul{display:flex;justify-content:center;list-style:none;margin:0;padding:24px 0 0;position:relative}
.tree>ul{padding-top:0}
.tree li{position:relative;display:flex;flex-direction:column;align-items:center;padding:24px 6px 0}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:24px;border-top:1.5px solid var(--muted)}
.tree li::after{right:auto;left:50%;border-left:1.5px solid var(--muted)}
.tree li:only-child::before{display:none}.tree li:only-child::after{border-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0}
.tree li:last-child::before{border-right:1.5px solid var(--muted);border-radius:0 8px 0 0}
.tree li:first-child::after{border-radius:8px 0 0 0}
.tree li:only-child::after{border-radius:0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:24px;border-left:1.5px solid var(--muted)}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.person{width:148px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px 12px;display:grid;justify-items:center;gap:6px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.person[disabled]{cursor:default}
.person:not([disabled]):hover{border-color:var(--gold)}
.person.top{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.ava{width:68px;height:68px;border-radius:50%;object-fit:cover;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:600 22px var(--f-display);border:2px solid var(--gold-soft)}
.person .pn{font-weight:600;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.person .pj{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
@media (max-width:480px){.person{width:128px;padding:12px 6px}.ava{width:56px;height:56px;font-size:18px}}
.pv{display:flex;align-items:center;gap:14px}
.check.ok{background:var(--ok-soft);color:var(--ok)}.check.bad{background:var(--bad-soft);color:var(--bad)}
</style>

/* ===== Penyimpanan ganda: cloud + perangkat ===== */
function persistLocal(){try{localStorage.setItem(CACHE,JSON.stringify({ST,at:new Date().toISOString()}))}catch(e){}}
function loadLocal(){try{const c=JSON.parse(localStorage.getItem(CACHE)||'null');if(c&&c.ST){Object.assign(ST,c.ST);COLS.forEach(k=>ST[k]=ST[k]||{});return c.at}}catch(e){}return null}
function pend(){try{return JSON.parse(localStorage.getItem(PEND)||'[]')}catch(e){return[]}}
function setPend(a){try{localStorage.setItem(PEND,JSON.stringify(a))}catch(e){}}
function addPend(col,id,op){const a=pend().filter(x=>!(x.col===col&&x.id===id));a.push({col,id,op});setPend(a)}
function setSync(s,t){const el=$('sync');const n=pend().length;
  const m={ok:['ok','Tersimpan di cloud'],wait:['wait',`${n} perubahan belum terkirim`],err:['err','Gagal tersambung'],local:['wait','Mode perangkat']}[s];
  el.innerHTML=`<span class="dot ${m[0]}"></span><span>${t||m[1]}</span>`}
async function save(col,id,data){
  data={...data,diubah:new Date().toISOString()};
  if(col==='meta')ST.meta=data;else ST[col][id]=data;
  persistLocal();render();
  if(!db){addPend(col,id,'set');setSync(online?'wait':'local');return}
  try{await db.doc(`${ROOT}/${col}/${id}`).set(data);setSync('ok')}
  catch(e){addPend(col,id,'set');setSync('wait');toast(e?.code==='permission_denied'?'Anda tidak punya izin menyimpan.':'Belum terkirim ke cloud. Tersimpan di perangkat dan akan dikirim ulang.')}
}
async function del(col,id){
  delete ST[col][id];persistLocal();render();
  if(!db){addPend(col,id,'delete');return}
  try{await db.doc(`${ROOT}/${col}/${id}`).delete();setSync('ok')}catch(e){addPend(col,id,'delete');setSync('wait')}
}
async function flush(){
  if(!db)return toast('Cloud belum tersambung. Data tetap aman di perangkat ini.');
  const a=pend();let ok=0;
  for(const p of a){try{
    if(p.op==='delete')await db.doc(`${ROOT}/${p.col}/${p.id}`).delete();
    else{const d=p.col==='meta'?ST.meta:ST[p.col][p.id];if(d)await db.doc(`${ROOT}/${p.col}/${p.id}`).set(d)}
    ok++}catch(e){break}}
  setPend(a.slice(ok));setSync(pend().length?'wait':'ok');toast(ok?`${ok} perubahan terkirim ke cloud.`:'Semua data sudah sinkron.')
}

/* ===== Perhitungan ===== */
function harga(kanal,u){const h=M().harga;return h[kanal]?.[u]??h.langganan?.[u]??h.umum?.[u]??0}
function saleRev(s){let t=0;for(const it of s.items||[])t+=(s.metode==='konsinyasi'?(+it.laku||0):(+it.qty||0))*(+it.harga||0);return t-(s.metode==='konsinyasi'?0:(+s.diskon||0))}
function salePaid(s){return s.metode==='cash'?saleRev(s):(s.bayar||[]).reduce((a,b)=>a+(+b.jumlah||0),0)}
function payLine(r){
  if(r.jenis==='tetap')return Math.round((+r.gaji||0)*(+r.hadir||0)/(+r.hariPeriode||14))+(+r.tambahan||0)-(+r.potongan||0);
  return (+r.penuh||0)*(+r.upahHari||0)+(+r.setengah||0)*(+r.upahSetengah||0)+(+r.bungkus||0)*(+r.upahBungkus||0)+(+r.tambahan||0)-(+r.potongan||0)}
function payTot(p){let prod=0,op=0;for(const r of p.baris||[]){const t=payLine(r);if(r.beban==='operasional')op+=t;else prod+=t}return{prod,op,tot:prod+op}}
function asetList(){const m=M();const a=(m.aset||[]).map(x=>({...x,umur:+x.umur||m.umurAset}));
  for(const k of vals(ST.kas))if(k.kat==='aset')a.push({nama:k.ket||'Aset',harga:+k.jumlah,tgl:k.tgl,umur:+k.umur||m.umurAset});return a}
function susut(from,to){const m=M();let t=0;if(!from||!to)return 0;
  for(const a of asetList()){const s=[from,m.mulaiSusut,a.tgl].sort().pop();const d=dayDiff(s,to)+1;if(d>0)t+=a.harga/(a.umur*30.4375)*d}
  return Math.round(t)}
function aktifBatch(){return vals(ST.batch).filter(b=>!b.arsip).sort(byDate)}
function bcalc(id){
  const b=ST.batch[id];const r={biaya:0,rb:{},op:0,ro:{},pend:0,gPack:0,gSold:0,gTitip:0,stok:{},trx:0,piut:0};
  UK.forEach(u=>r.stok[u.k]={masuk:0,jual:0,titip:0,sisa:0});
  if(!b)return r;
  if(b.arsip){const s=b.ringkasan||{};Object.assign(r,{pend:s.pendapatan||0,biaya:s.biaya||0,hpp:s.biaya||0,op:s.beban||0,susut:0,trx:s.transaksi||0,gPack:(s.hasilKg||0)*1000,gSold:(s.hasilKg||0)*1000});r.lk=r.pend-r.hpp;r.lb=r.lk-r.op;r.persediaan=0;r.cpg=r.gPack?r.biaya/r.gPack:0;return r}
  const ab=(o,k,v)=>o[k]=(o[k]||0)+v;
  for(const k of vals(ST.kas))if(k.batch===id){const c=KAT[k.kat];if(!c)continue;
    if(c.grup==='produksi'){r.biaya+=+k.jumlah;ab(r.rb,c.l,+k.jumlah)}else if(c.grup==='operasional'){r.op+=+k.jumlah;ab(r.ro,k.sub||'Lain-lain',+k.jumlah)}}
  for(const p of vals(ST.payroll))if(p.batch===id){const t=payTot(p);if(t.prod){r.biaya+=t.prod;ab(r.rb,'Gaji produksi',t.prod)}if(t.op){r.op+=t.op;ab(r.ro,'Gaji marketing',t.op)}}
  for(const m of vals(ST.kemas))if(m.batch===id)for(const[u,q]of Object.entries(m.items||{})){if(!r.stok[u])continue;r.stok[u].masuk+=+q;r.gPack+=q*G[u]}
  for(const s of vals(ST.jual))if(s.batch===id){r.trx++;const rev=saleRev(s);r.pend+=rev;r.piut+=rev-salePaid(s);
    for(const it of s.items||[]){const g=G[it.u]||0,st=r.stok[it.u];if(!st)continue;
      if(s.metode==='konsinyasi'){const out=(+it.qty||0)-(+it.retur||0),laku=+it.laku||0;st.jual+=laku;st.titip+=out-laku;r.gSold+=laku*g;r.gTitip+=(out-laku)*g}
      else{st.jual+=+it.qty||0;r.gSold+=(+it.qty||0)*g}}}
  UK.forEach(u=>{const s=r.stok[u.k];s.sisa=s.masuk-s.jual-s.titip});
  r.cpg=r.gPack?r.biaya/r.gPack:0;
  r.hpp=r.gPack?Math.round(r.biaya*Math.min(1,r.gSold/r.gPack)):0;
  r.persediaan=r.biaya-r.hpp;
  r.susut=susut(b.mulai,b.tutup||today());
  r.lk=r.pend-r.hpp;r.lb=r.lk-r.op-r.susut;
  return r}

/* Buku besar: setiap catatan menjadi jurnal berpasangan (debit = kredit) */
function ledger(){
  const J=[];const A=(tgl,akun,d,k,x={})=>{if(d||k)J.push({tgl,akun,d:+d||0,k:+k||0,...x})};
  const sa=M().saldoAwal;
  if(sa){const t=sa.tgl;A(t,'Kas',sa.kas,0,{cf:'awal',ket:'Saldo awal'});A(t,'Piutang',sa.piutang,0);A(t,'Persediaan',sa.persediaan,0);A(t,'AsetTetap',sa.asetTetap,0);
    A(t,'UtangUsaha',0,sa.utang);A(t,'Modal',0,sa.modal);A(t,'LabaDitahan',0,sa.labaDitahan)}
  for(const k of vals(ST.kas)){const c=KAT[k.kat];if(!c)continue;const j=+k.jumlah||0,ket=(k.sub?k.sub+' · ':'')+(k.ket||c.l);const x={cf:c.cf,grp:c.grp,ket,batch:k.batch,ref:'kas:'+k.id};
    if(c.arah==='masuk'){A(k.tgl,'Kas',j,0,x);A(k.tgl,c.akun,0,j)}
    else{A(k.tgl,c.akun,j,0);
      if(k.tglBayar===k.tgl)A(k.tgl,'Kas',0,j,x);
      else{A(k.tgl,'UtangUsaha',0,j);if(k.tglBayar){A(k.tglBayar,'UtangUsaha',j,0);A(k.tglBayar,'Kas',0,j,x)}}}}
  for(const s of vals(ST.jual)){const rev=saleRev(s);const x={cf:'operasi',grp:'Penerimaan penjualan',ket:'Penjualan · '+(s.pelanggan||'Umum'),batch:s.batch,ref:'jual:'+s.id};
    A(s.tgl,'Piutang',rev,0);A(s.tgl,'Pendapatan',0,rev);
    if(s.metode==='cash'){A(s.tgl,'Kas',rev,0,x);A(s.tgl,'Piutang',0,rev)}
    else for(const b of s.bayar||[]){A(b.tgl,'Kas',+b.jumlah,0,{...x,ket:'Pelunasan · '+(s.pelanggan||'')});A(b.tgl,'Piutang',0,+b.jumlah)}}
  for(const p of vals(ST.payroll)){const t=payTot(p);A(p.selesai,'Persediaan',t.prod,0);A(p.selesai,'BebanOp',t.op,0);A(p.selesai,'UtangGaji',0,t.tot);
    if(p.tglBayar){A(p.tglBayar,'UtangGaji',t.tot,0);A(p.tglBayar,'Kas',0,t.tot,{cf:'operasi',grp:'Pembayaran gaji',ket:`Gaji ${fd(p.mulai)} – ${fd(p.selesai)}`,batch:p.batch,ref:'pay:'+p.id})}}
  for(const b of aktifBatch()){const r=bcalc(b.id),t=b.tutup||today();A(t,'HPP',r.hpp,0);A(t,'Persediaan',0,r.hpp);A(t,'BebanSusut',r.susut,0);A(t,'AkumSusut',0,r.susut)}
  return J}
function balances(J){const b={};for(const l of J)b[l.akun]=(b[l.akun]||0)+l.d-l.k;const g=k=>b[k]||0;
  const labaBerjalan=-(g('Pendapatan')+g('PendLain')+g('HPP')+g('BebanOp')+g('BebanSusut'));
  const aset=g('Kas')+g('Piutang')+g('Persediaan')+g('AsetTetap')+g('AkumSusut');
  const kew=-(g('UtangUsaha')+g('UtangGaji'));
  const ek=-g('Modal')-g('LabaDitahan')+labaBerjalan-g('Prive');
  return{g,labaBerjalan,aset,kew,ek,selisih:Math.round(aset-kew-ek)}}

/* ===== Komponen ===== */
/* ===== Bahan masuk: Lembaran / Cacagan / Lapoan ===== */
function bahanKg(b){if(b.kgLembaran!==undefined||b.kgCacagan!==undefined||b.kgLapoan!==undefined)return{lembaran:+b.kgLembaran||0,cacagan:+b.kgCacagan||0,lapoan:+b.kgLapoan||0};
  return{lembaran:b.bahan==='cacagan'?0:(+b.beratBeli||0),cacagan:b.bahan==='cacagan'?(+b.beratBeli||0):0,lapoan:0}}
function bahanTotal(b){const k=bahanKg(b);return k.lembaran+k.cacagan+k.lapoan}
function bahanChips(b){const k=bahanKg(b);
  const c=(n,l)=>`<span class="tag ${k[n]>0?'ok':''}" style="${k[n]>0?'':'opacity:.45'}">${k[n]>0?'● ':'○ '}${l} ${k[n]>0?nf.format(k[n])+' kg':'—'}</span>`;
  return `<div class="row w" style="gap:6px;margin:8px 0">${c('lembaran','Lembaran')}${c('cacagan','Cacagan')}${c('lapoan','Lapoan')}<span class="tag gold">Total ${nf.format(bahanTotal(b))} kg</span>${b.modal?`<span class="tag">Modal ${rp(b.modal)}</span>`:''}</div>`}
function bahanLabel(b){const k=bahanKg(b);const p=[];if(k.lembaran)p.push('lembaran');if(k.cacagan)p.push('cacagan');if(k.lapoan)p.push('lapoan');return p.length?p.join(' + '):'—'}
function lampState(b,key){const t=(b.tahap||{})[key]||{};
  if(t.status==='lewati')return['skip','Dilewati'];
  if(t.status==='selesai')return['done','Selesai '+fd(t.selesai).replace(/ \d{4}$/,'')];
  if(t.status==='berjalan'){const d=dayDiff(t.mulai,today()),tg=M().target[key]||1;return d>tg?['late',`Hari ke-${d+1}, lewat target`]:['run',`Hari ke-${d+1} dari ${tg}`]}
  return['wait','Menunggu']}
/* Kg per tahap: berat timbangan manual bila ada, kalau belum ada ikut tahap sebelumnya (perkiraan ~).
   Cincang & Lapo: berat manual = hasil olahan sendiri, lalu ditambah cacagan / lapoan yang dibeli. */
function alurKg(b){const bk=bahanKg(b),tb=b.tahap||{},out=[];let prev=0;
  TAHAP.forEach(([k],i)=>{const m=+tb[k]?.berat||0,man=m>0;let own,tot,masuk=0;
    if(i===2){own=man?m:prev;masuk=bk.cacagan;tot=own+masuk}
    else if(i===5){own=man?m:prev;masuk=bk.lapoan;tot=own+masuk}
    else{tot=man?m:prev;if(i===0&&!man)tot=bk.lembaran}
    const est=!man&&i>0&&!(i===2&&bk.lembaran===0);
    out.push({tot,masuk,est:est&&tot>0&&i!==0});prev=tot});
  return out}
function lamps(b){let done=0,cur=null;const bk=bahanKg(b);const AK=alurKg(b);
  const items=TAHAP.map(([k,l],i)=>{const[s,txt]=lampState(b,k);
    /* kg yang lewat tahap ini: lembaran dari awal, cacagan masuk di Cincang, lapoan masuk di Lapo */
    const flow=AK[i].tot,masuk=AK[i].masuk,est=AK[i].est;if(s==='done'||s==='skip')done++;if(!cur&&(s==='run'||s==='late'))cur=l;
    const sym=s==='done'?'✓':s==='skip'?'–':i+1;
    return `<button class="lamp ${s}" data-act="tahap" data-b="${b.id}" data-k="${k}" ${canWrite?'':'disabled'} aria-label="${l}: ${txt}"><span class="bulb">${sym}</span><span class="nm"><span class="fn">${l}</span><span class="sn">${l.replace(/^Di/,'').replace(/^./,c=>c.toUpperCase())}</span></span><span class="st">${txt}</span><span class="kg">${flow?(est?'~':'')+nf.format(flow)+' kg':''}</span><span class="in">${masuk?'+'+nf.format(masuk):''}</span></button>`}).join('');
  const pct=done/TAHAP.length;
  return{html:`<div class="lamps"><span class="fill" style="width:${86*pct}%"></span>${items}</div>`,pct,cur,done}}
const legend=`<div class="legend"><span><i style="background:var(--ok);border-color:var(--ok)"></i>Selesai</span><span><i style="background:var(--run);border-color:var(--run)"></i>Sedang berjalan</span><span><i style="background:var(--bad);border-color:var(--bad)"></i>Lewat target</span><span><i></i>Menunggu</span><span><i style="border-style:dashed"></i>Dilewati</span><span><b style="color:var(--gold)">+kg</b>&nbsp;bahan beli masuk di tahap ini</span><span>~ = perkiraan, belum ditimbang</span></div>`;
function batchOpts(sel,all){const bs=vals(ST.batch).filter(b=>all||!b.arsip).sort(byDate).reverse();return bs.map(b=>`<option value="${b.id}" ${b.id===sel?'selected':''}>${esc(b.kode)}${b.tutup?' (selesai)':''}</option>`).join('')}
function defBatch(){const a=aktifBatch().filter(b=>!b.tutup);return(a[a.length-1]||aktifBatch().pop()||{}).id||''}
function bname(id){return ST.batch[id]?.kode||'—'}
function stokTotal(ids){const t={};UK.forEach(u=>t[u.k]={masuk:0,jual:0,titip:0,sisa:0});let nilai=0,g=0;
  for(const id of ids){const r=bcalc(id);UK.forEach(u=>{for(const f in t[u.k])t[u.k][f]+=r.stok[u.k][f];nilai+=r.stok[u.k].sisa*G[u.k]*r.cpg;g+=r.stok[u.k].sisa*G[u.k]})}
  return{t,nilai,g}}

/* ===== Halaman ===== */
function pRingkasan(){
  const J=ledger(),B=balances(J);const act=aktifBatch().filter(b=>!b.tutup);const cur=act[act.length-1];
  const st=stokTotal(aktifBatch().map(b=>b.id));const pcs=UK.reduce((a,u)=>a+st.t[u.k].sisa,0);

function alerts(B){const a=[];
  for(const b of aktifBatch())for(const[k,l]of TAHAP)if(lampState(b,k)[0]==='late')a.push(['bad',`${b.kode}: tahap ${l} melewati target ${M().target[k]} hari`]);
  const st=stokTotal(aktifBatch().map(b=>b.id)).t;for(const u of UK){const s=st[u.k];if(s.masuk&&s.sisa<=Math.max(5,s.masuk*0.1)&&s.sisa>=0)a.push(['run',`Stok ${u.l} tinggal ${s.sisa} pcs`]);if(s.sisa<0)a.push(['bad',`Stok ${u.l} minus ${s.sisa} pcs. Kemasan belum dicatat?`])}
  const piut=vals(ST.jual).filter(s=>saleRev(s)-salePaid(s)>0);if(piut.length)a.push(['gold',`${piut.length} penjualan belum lunas, total ${rp(piut.reduce((x,s)=>x+saleRev(s)-salePaid(s),0))}`]);
  const tit=vals(ST.jual).filter(s=>s.metode==='konsinyasi'&&(s.items||[]).some(i=>(+i.qty||0)-(+i.laku||0)-(+i.retur||0)>0));if(tit.length)a.push(['gold',`${tit.length} titipan konsinyasi masih di toko`]);
  const ug=-B.g('UtangGaji');if(ug>0)a.push(['run',`Gaji belum dibayar ${rp(ug)}`]);
  const uu=-B.g('UtangUsaha');if(uu>0)a.push(['run',`Utang usaha ${rp(uu)}`]);
  return a.length?`<div class="list">${a.map(([t,x])=>`<div class="li"><div class="t"><div>${esc(x)}</div></div><span class="tag ${t}">${t==='bad'?'Segera':t==='run'?'Cek':'Info'}</span></div>`).join('')}</div>`:'<div class="empty">Semua aman. Tidak ada tahap terlambat, utang, atau stok menipis.</div>'}
function chart(){const bs=vals(ST.batch).sort(byDate);if(!bs.length)return '<div class="empty">Belum ada data batch.</div>';
  const d=bs.map(b=>({k:b.kode,v:bcalc(b.id).lb,open:!b.arsip&&!b.tutup}));
  const max=Math.max(1,...d.map(x=>Math.abs(x.v))),W=Math.max(320,d.length*90),H=200,pad=30,mid=H/2,sc=(mid-pad)/max,bw=Math.min(44,(W-40)/d.length*.5);
  const bars=d.map((x,i)=>{const cx=20+(i+.5)*(W-40)/d.length,h=Math.abs(x.v)*sc,y=x.v>=0?mid-h:mid;
    return `<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${Math.max(1,h)}" rx="3" fill="${x.v>=0?'var(--gold)':'var(--bad)'}" ${x.open?'fill-opacity=".55"':''}/>
    <text class="lbl" x="${cx}" y="${x.v>=0?y-6:y+h+14}" text-anchor="middle">${(x.v/1e6).toLocaleString('id-ID',{maximumFractionDigits:2})} jt</text>
    <text x="${cx}" y="${H-4}" text-anchor="middle">${esc(x.k)}${x.open?' *':''}</text>`}).join('');
  return `<div class="tw"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W,520)}px;max-height:240px" role="img" aria-label="Laba bersih per batch"><line x1="10" x2="${W-10}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>${bars}</svg></div>`}

   ${L('Harga pokok penjualan',-r.hpp,'sub')}${L(r.lk>=0?'Laba kotor':'Rugi kotor',r.lk,'sub')}
   <tr class="sec"><td colspan="2">Beban usaha</td></tr>${b.arsip?L('Beban operasional',-r.op,'ind'):ro.replace(/<span class="">Rp/g,'<span class="">−Rp')+L('Penyusutan aset tetap',r.susut,'ind')}
   ${L('Total beban usaha',-(r.op+(r.susut||0)),'sub')}
   ${L(r.lb>=0?'Laba bersih':'Rugi bersih',r.lb,'tot')}</tbody></table></div>
   <p class="note">${b.arsip?'Angka dari laporan arsip Batch 001–003 (tanpa penyusutan).':`HPP = biaya produksi × (gram terjual ÷ gram dikemas). Biaya per gram ${rp(r.cpg*1)} → per 100 gr ${rp(r.cpg*100)}.${r.gSold&&!r.gPack?' Catat hasil kemasan agar HPP terhitung.':''}`}</p>`}
function pLaporan(){
  const bs=vals(ST.batch).sort(byDate).reverse();if(!ui.lap||!ST.batch[ui.lap])ui.lap=defBatch()||bs[0]?.id||'';
  const J=ledger(),B=balances(J),g=B.g,sa=M().saldoAwal;
  let o=`<div class="head"><div><div class="eyebrow">Persamaan dasar: Aset = Kewajiban + Ekuitas</div><h2>Laporan keuangan</h2></div></div>`;
  o+=`<section class="panel"><div class="head" style="margin-bottom:10px"><h3>Laba rugi per batch</h3><select class="cell" id="lapB" style="width:auto">${batchOpts(ui.lap,true)}</select></div>${ui.lap?lrTable(ui.lap):'<div class="empty">Belum ada batch.</div>'}</section>`;

    <tr class="sec"><td colspan="2">Aset</td></tr>${R('Kas',g('Kas'),'ind')}${R('Piutang usaha',g('Piutang'),'ind')}${R('Persediaan (bahan, proses, barang jadi)',g('Persediaan'),'ind')}${R('Aset tetap (harga perolehan)',g('AsetTetap'),'ind')}${R('Akumulasi penyusutan',g('AkumSusut'),'ind')}${R('Total aset',B.aset,'tot')}
    <tr class="sec"><td colspan="2">Kewajiban</td></tr>${R('Utang usaha',-g('UtangUsaha'),'ind')}${R('Utang gaji',-g('UtangGaji'),'ind')}${R('Total kewajiban',B.kew,'sub')}
    <tr class="sec"><td colspan="2">Ekuitas</td></tr>${R('Modal disetor',-g('Modal'),'ind')}${R('Laba ditahan s.d. Batch 003',-g('LabaDitahan'),'ind')}${R('Laba berjalan sejak saldo awal',B.labaBerjalan,'ind')}${R('Bagi hasil dibagikan',-g('Prive'),'ind')}${R('Total ekuitas',B.ek,'sub')}
    ${R('Total kewajiban + ekuitas',B.kew+B.ek,'tot')}</tbody></table></div>
    <div class="check ${B.selisih?'bad':'ok'}">${B.selisih?'✕ Tidak seimbang, selisih '+rp(B.selisih):'✓ Seimbang: total aset sama dengan kewajiban + ekuitas'}</div></section>`;
  const kl=J.filter(l=>l.akun==='Kas'&&l.cf!=='awal');const grp={};for(const l of kl){const k=l.cf+'|'+l.grp;grp[k]=(grp[k]||0)+l.d-l.k}
  const sec=(cf,t)=>{const e=Object.entries(grp).filter(([k])=>k.startsWith(cf+'|'));const tot=e.reduce((a,[,v])=>a+v,0);return `<tr class="sec"><td colspan="2">${t}</td></tr>${e.map(([k,v])=>R(k.split('|')[1],v,'ind')).join('')||R('Tidak ada',0,'ind')}${R('Arus kas bersih',tot,'sub')}`};
  const kasAwal=sa?.kas||0;
  o+=`<section class="panel"><h3>Arus kas sejak ${fd(sa?.tgl)}</h3><div class="tw"><table><tbody>${R('Kas awal (akhir Batch 003)',kasAwal,'sub')}${sec('operasi','Aktivitas operasi')}${sec('investasi','Aktivitas investasi')}${sec('pendanaan','Aktivitas pendanaan')}${R('Kenaikan (penurunan) kas',g('Kas')-kasAwal,'sub')}${R('Kas akhir',g('Kas'),'tot')}</tbody></table></div></section></div>`;
  const setor=vals(ST.kas).filter(k=>k.kat==='modal').reduce((a,k)=>a+(+k.jumlah||0),0);
  o+=`<section class="panel"><h3>Perubahan ekuitas</h3><div class="tw"><table><tbody>${R('Ekuitas awal per '+fd(sa?.tgl),(sa?.modal||0)+(sa?.labaDitahan||0),'sub')}${R('Tambahan setoran modal',setor,'ind')}${R('Laba (rugi) berjalan',B.labaBerjalan,'ind')}${R('Bagi hasil ke investor',-g('Prive'),'ind')}${R('Ekuitas akhir',B.ek,'tot')}</tbody></table></div>
   <p class="note">Ekuitas awal Rp22.471.187 = modal disetor Rp21.101.504 (Rp16.101.504 Batch 001 + Rp5.000.000 Batch 002) + laba ditahan Rp1.369.683 (−6.333.504 + 2.960.854 + 4.742.333).</p></section>`;
  return o}

function pInvestor(){const m=M(),inv=m.investor||[];const bs=vals(ST.batch).sort(byDate);
  const paid=(b,i)=>vals(ST.kas).filter(k=>k.kat==='bagiHasil'&&k.batch===b&&+k.investor===i).reduce((a,k)=>a+(+k.jumlah||0),0);
  let o=`<div class="head"><div><div class="eyebrow">Porsi ${inv.map(x=>x.porsi+'%').join(' : ')}</div><h2>Bagi hasil investor</h2><p>Hak investor = laba bersih batch × porsi. Batch rugi tidak dibagikan; rugi ditanggung sesuai porsi.</p></div><button class="btn pri w" data-act="kasBaru" data-kat="bagiHasil">Catat pembagian</button></div>`;
  o+=`<section class="panel"><div class="tw"><table><thead><tr><th>Batch</th><th class="n">Laba bersih</th>${inv.map(x=>`<th class="n">${esc(x.nama)}</th>`).join('')}<th>Status</th></tr></thead><tbody>${bs.map(b=>{const r=bcalc(b.id),open=!b.arsip&&!b.tutup;
    return `<tr><td>${esc(b.kode)}${open?' <span class="tag run">berjalan</span>':''}</td><td class="n">${rpc(r.lb)}</td>${inv.map((x,i)=>{const hak=r.lb*x.porsi/100,p=paid(b.id,i);return `<td class="n">${rpc(hak)}${p?`<div class="mut" style="font-size:11px">dibayar ${rp(p)}</div>`:''}</td>`}).join('')}<td>${r.lb<0?'<span class="tag bad">Rugi</span>':open?'<span class="tag">Sementara</span>':inv.every((x,i)=>paid(b.id,i)>=Math.round(r.lb*x.porsi/100))?'<span class="tag ok">Lunas</span>':'<span class="tag gold">Belum dibagi</span>'}</td></tr>`}).join('')}
    <tr class="tot"><td>Akumulasi</td><td class="n">${rpc(bs.reduce((a,b)=>a+bcalc(b.id).lb,0))}</td>${inv.map(x=>`<td class="n">${rpc(bs.reduce((a,b)=>a+bcalc(b.id).lb,0)*x.porsi/100)}</td>`).join('')}<td></td></tr></tbody></table></div>
    <p class="note">Pembagian laba dicatat di buku kas kategori “Bagi hasil investor”. Ini mengurangi kas dan ekuitas, bukan beban, sehingga laba batch tidak berubah.</p></section>`;
  return o}

function fotoKecil(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const S=280,c=document.createElement('canvas');c.width=c.height=S;const m=Math.min(im.width,im.height);
  c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);res(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)})}

document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,d=t.dataset;
  if(a==='tutup'){if(e.target===t)close();return}
  const W=()=>{if(!canWrite){toast('Hanya pengelola yang dapat mengubah data.');return false}return true};
  switch(a){
  case 'batchBaru':if(W())fBatch();break;
  case 'batchEdit':if(W())fBatch(ST.batch[d.b]);break;
  case 'tahap':if(W())fTahap(d.b,d.k);break;
  case 'kemasBaru':if(W())fKemas();break;
  case 'kemasEdit':if(canWrite)fKemas(ST.kemas[d.id]);break;
  case 'jualBaru':if(W())fJual();break;
  case 'jualLihat':fJualLihat(ST.jual[d.id]);break;
  case 'kasBaru':if(W())fKas(null,d.kat);break;
  case 'kasEdit':if(canWrite)fKas(ST.kas[d.id]);break;
  case 'pekerjaBaru':if(W())fPekerja();break;
  case 'pekerjaEdit':if(canWrite)fPekerja(ST.pekerja[d.id]);break;
  case 'payBaru':if(W())fPay();break;
  case 'payLihat':fPay(ST.payroll[d.id]);break;
  case 'jualF':ui.jualF=d.k;render();break;
  case 'kasF':ui.kasF=d.k;render();break;
  case 'itemAdd':{const c=$('items'),i=Date.now()%1e6;c.insertAdjacentHTML('beforeend',itemRow({u:'50'},i,$('j_kanal').value));calcJual();break}
  case 'itemDel':if(document.querySelectorAll('[data-row]').length>1){t.closest('[data-row]').remove();calcJual()}break;
  case 'hapus':{if(t.dataset.confirm!=='1'){t.dataset.confirm='1';t.textContent='Tekan lagi untuk menghapus';return}
    if(d.col==='batch'&&[...vals(ST.jual),...vals(ST.kas),...vals(ST.kemas),...vals(ST.payroll)].some(x=>x.batch===d.id)){toast('Batch masih dipakai transaksi. Hapus transaksinya dulu.');return}
    await del(d.col,d.id);close();toast('Dihapus.');break}
  case 'simpanBatch':{const b={...(ST.batch[d.id]||{tahap:{}}),id:d.id,kode:$('b_kode').value.trim()||'Batch',mulai:$('b_mulai').value,kgLembaran:num('b_lem')||0,kgCacagan:num('b_cac')||0,kgLapoan:num('b_lap')||0,modal:num('b_modal')||0};
    b.beratBeli=b.kgLembaran+b.kgCacagan+b.kgLapoan;b.bahan=b.kgLembaran>0?'lembaran':b.kgCacagan>0?'cacagan':'lapoan';
    if($('b_tutup'))b.tutup=$('b_tutup').value||null;
    if(d.new){if(b.kgLembaran>0)b.tahap.lembaran={status:'berjalan',mulai:b.mulai,berat:b.kgLembaran};
      else{const lew=b.kgCacagan>0?['lembaran','rendam','cincang']:['lembaran','rendam','cincang','jemur','bumbu','lapo'];
        for(const k of lew)b.tahap[k]={status:'lewati'};const nx=b.kgCacagan>0?'jemur':'goreng';b.tahap[nx]={status:'berjalan',mulai:b.mulai}}}
    close();await save('batch',b.id,b);toast('Batch tersimpan.');break}
  case 'tahapCepat':case 'simpanTahap':{const b=structuredClone(ST.batch[d.b]);b.tahap=b.tahap||{};const o=b.tahap[d.k]||{};
    if(a==='tahapCepat'){o.status=d.s;if(d.s==='berjalan')o.mulai=today();else{o.mulai=o.mulai||today();o.selesai=today()}}
    else{o.status=$('t_st').value;o.mulai=$('t_mulai').value;o.selesai=o.status==='selesai'?$('t_sel').value:null;o.berat=num('t_berat')||'';o.catatan=$('t_cat').value}
    b.tahap[d.k]=o;
    if(o.status==='selesai'){const i=TAHAP.findIndex(x=>x[0]===d.k),nx=TAHAP[i+1];if(nx&&!(b.tahap[nx[0]]?.status)){b.tahap[nx[0]]={status:'berjalan',mulai:o.selesai}}}
    close();await save('batch',b.id,b);break}
  case 'simpanKemas':{const it={};UK.forEach(u=>{const q=num('m_'+u.k);if(q)it[u.k]=q});if(!Object.keys(it).length)return toast('Isi minimal satu ukuran.');
    if(!$('m_batch').value)return toast('Buat batch dulu.');close();await save('kemas',d.id,{id:d.id,tgl:$('m_tgl').value,batch:$('m_batch').value,items:it});toast('Hasil kemasan masuk stok.');break}
  case 'simpanJual':{const items=readItems().filter(x=>x.qty>0);if(!items.length)return toast('Isi jumlah minimal satu ukuran.');if(!$('j_batch').value)return toast('Buat batch dulu.');
    const s={id:d.id,tgl:$('j_tgl').value,batch:$('j_batch').value,pelanggan:$('j_pel').value.trim(),kanal:$('j_kanal').value,metode:$('j_met').value,diskon:num('j_disk'),items,bayar:[]};
    close();await save('jual',s.id,s);toast(`Penjualan ${rp(saleRev(s))} tersimpan.`);break}
  case 'simpanTitip':{const s=structuredClone(ST.jual[d.id]);s.items.forEach((it,i)=>{it.laku=num('k_l'+i);it.retur=num('k_r'+i);if(it.laku+it.retur>it.qty){it.laku=Math.min(it.laku,it.qty);it.retur=it.qty-it.laku}});close();await save('jual',s.id,s);toast('Titipan diperbarui.');break}
  case 'bayarJual':{const s=structuredClone(ST.jual[d.id]);const j=num('p_jml');if(!j)return toast('Isi jumlah pembayaran.');s.bayar=[...(s.bayar||[]),{tgl:$('p_tgl').value,jumlah:j}];close();await save('jual',s.id,s);toast('Pembayaran dicatat ke kas.');break}
  case 'simpanKas':{const kat=$('k_kat').value,c=KAT[kat],j=num('k_jml');if(!j)return toast('Isi jumlah.');
    if((c.grup)&&!$('k_batch').value)return toast('Biaya produksi dan operasional perlu batch.');
    const k={id:d.id,tgl:$('k_tgl').value,kat,batch:$('k_batch').value,jumlah:j,ket:$('k_ket').value.trim()};
    if(c.grup==='operasional')k.sub=$('k_sub').value;if(kat==='bagiHasil')k.investor=+$('k_inv').value;if(kat==='aset')k.umur=num('k_umur');
    k.tglBayar=c.arah==='masuk'?k.tgl:($('k_lunas').value==='lunas'?($('k_tb').value||k.tgl):null);
    close();await save('kas',k.id,k);toast('Transaksi kas tersimpan.');break}
  case 'simpanPekerja':{const p={id:d.id,nama:$('w_nama').value.trim(),tugas:$('w_tugas').value.trim(),jenis:$('w_jenis').value,beban:$('w_beban').value,upahHari:num('w_hari'),upahSetengah:num('w_set'),upahBungkus:num('w_bk'),gaji:num('w_gaji'),hariPeriode:num('w_hp')||14,aktif:$('w_aktif').value==='1'};

  case 'simpanPay':{const p=readPay();p.mulai=$('r_mulai').value;p.selesai=$('r_sel').value;p.batch=$('r_batch').value;p.tglBayar=$('r_st').value?$('r_tb').value:null;

  case 'simpanHarga':{if(!W())break;const m=M();const h={};for(const k of Object.keys(KANAL)){h[k]={};UK.forEach(u=>{const v=num(`h_${k}_${u.k}`);if(v)h[k][u.k]=v})}await save('meta','main',{...m,harga:h});toast('Harga tersimpan.');break}
  case 'simpanUmum':{if(!W())break;const m=M();const inv=(m.investor||[]).map((x,i)=>({nama:$('inv_n'+i).value.trim()||x.nama,porsi:num('inv_p'+i)}));
    if(inv.reduce((a,x)=>a+x.porsi,0)!==100)return toast('Total porsi investor harus 100%.');const tg={};TAHAP.forEach(([k])=>tg[k]=num('tg_'+k)||1);await save('meta','main',{...m,investor:inv,target:tg});toast('Tersimpan.');break}
  case 'simpanSaldo':{if(!W())break;const m=M();const sa={tgl:$('sa_tgl').value,kas:num('sa_kas'),asetTetap:num('sa_aset'),piutang:num('sa_piut'),persediaan:num('sa_pers'),utang:num('sa_utang'),modal:num('sa_modal'),labaDitahan:num('sa_ld')};
    const sel=sa.kas+sa.asetTetap+sa.piutang+sa.persediaan-sa.utang-sa.modal-sa.labaDitahan;if(sel)return toast(`Saldo awal tidak seimbang, selisih ${rp(sel)}.`);
    await save('meta','main',{...m,saldoAwal:sa,mulaiSusut:$('ms').value,umurAset:num('umur')||48});toast('Saldo awal tersimpan.');break}
  case 'orgBaru':if(W())fOrg();break;
  case 'orgEdit':if(canWrite)fOrg(ST.org[d.id]);break;
  case 'orgNoFoto':window._foto='';$('o_prev').innerHTML=avatar({nama:$('o_nama').value,foto:''});break;
  case 'simpanOrg':{const x={id:d.id,nama:$('o_nama').value.trim(),jabatan:$('o_jab').value.trim(),induk:$('o_induk').value,urut:num('o_urut')||1,foto:window._foto||''};
    if(!x.nama||!x.jabatan)return toast('Isi nama dan jabatan.');
    let p=x.induk;while(p){if(p===x.id)return toast('Atasan tidak boleh bawahannya sendiri.');p=ST.org[p]?.induk}
    close();await save('org',x.id,x);toast('Struktur tersimpan.');break}
  case 'flush':flush();break;
  case 'backup':{const data=JSON.stringify({app:'dorokdok-qisha',versi:1,dibuat:new Date().toISOString(),data:ST},null,1);
    if(!dl)return toast('Unduhan tidak tersedia di tampilan ini.');try{await dl.save({filename:`dorokdok-qisha-cadangan-${today()}.json`,data:new Blob([data],{type:'application/json'})});toast('Cadangan diunduh.')}catch(err){toast(err?.code==='declined'?'Unduhan dibatalkan.':'Unduhan gagal.')}break}
  }});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='lapB'){ui.lap=t.value;render()}
  if(t.id==='stokB'){ui.stokB=t.value;render()}
  if(t.id==='j_kanal'){document.querySelectorAll('[data-row]').forEach(r=>{const i=r.dataset.row;$('it_h'+i).value=harga(t.value,$('it_u'+i).value)});calcJual()}
  if(t.dataset.act==='itemU'){const i=t.id.slice(4);$('it_h'+i).value=harga($('j_kanal').value,t.value);calcJual()}
  if(t.id==='k_kat')katVis();
  if(t.id==='o_file'&&t.files[0]){try{window._foto=await fotoKecil(t.files[0]);$('o_prev').innerHTML=avatar({nama:$('o_nama').value,foto:window._foto})}catch(err){toast('Foto tidak bisa dibaca. Coba file JPG atau PNG.')}}
  if(t.id==='restore'&&t.files[0]){if(!canWrite)return toast('Hanya pengelola yang dapat memulihkan data.');try{const j=JSON.parse(await t.files[0].text());if(j.app!=='dorokdok-qisha')throw 0;
      const D=j.data;if(D.meta)await save('meta','main',D.meta);for(const c of COLS)for(const[id,v]of Object.entries(D[c]||{}))await save(c,id,v);toast('Data dipulihkan dari cadangan.')}catch(err){toast('File bukan cadangan Dorokdok Qisha.')}t.value=''}});
document.addEventListener('input',e=>{const t=e.target;if(t.closest('#items')||t.id==='j_disk')calcJual();
  if(t.dataset.act==='payCalc'&&window._pay){const p=readPay();p.baris.forEach((r,i)=>{if($('r_t'+i))$('r_t'+i).textContent=rp(payLine(r))});$('r_tot').textContent=rp(payTot(p).tot)}});

/* ===== Mulai ===== */
(async function boot(){
  const at=loadLocal();route();setSync('local',at?'Data perangkat':'Menyambung');
  const user=await window.claude?.use?.('user').catch(()=>null);
  db=await window.claude?.use?.('db').catch(()=>null);
  dl=await window.claude?.use?.('downloads').catch(()=>null);
  if(!db){canWrite=true;$('role').textContent='Mode perangkat';setSync('local');render();return}
  canWrite=user?(await user.canEdit()):false;
  $('role').textContent=canWrite?'Pengelola':'Investor · lihat saja';
  online=true;const seen=new Set();let timer=setTimeout(()=>setSync('err','Cloud lambat merespons'),10000);
  const done=k=>{seen.add(k);if(seen.size===COLS.length+1){clearTimeout(timer);setSync(pend().length?'wait':'ok');if(pend().length&&canWrite)flush()}};
  const merge=(col,docs)=>{const P=new Set(pend().filter(p=>p.col===col&&p.op==='set').map(p=>p.id));const n={};for(const s of docs)n[s.id]=s.data();for(const id of P)if(ST[col][id])n[id]=ST[col][id];ST[col]=n};
  db.doc(`${ROOT}/meta/main`).onSnapshot(s=>{if(s.exists&&!pend().some(p=>p.col==='meta'))ST.meta=s.data();persistLocal();render();done('meta')},()=>setSync('err'));
  for(const c of COLS)db.collection(`${ROOT}/${c}`).onSnapshot(s=>{merge(c,s.docs);persistLocal();if(!document.querySelector('.scrim'))render();done(c)},()=>setSync('err'));
})();
</script>
